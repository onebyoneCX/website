let revealObserver=null;
function initScrollReveal(){
 if(revealObserver){revealObserver.disconnect();revealObserver=null}
 const elements=[...document.querySelectorAll('#app .section .intro,#app .tile,#app .step,#app .feature,#app .example,#app .services-detail article,#app .page-head .wrap,#app .cta .wrap')];
 if(!('IntersectionObserver' in window)||window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  elements.forEach(el=>el.classList.add('is-visible'));return;
 }
 revealObserver=new IntersectionObserver((entries,observer)=>{
  entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}});
 },{threshold:0.08,rootMargin:'0px 0px -25px 0px'});
 elements.forEach(el=>{
  const rect=el.getBoundingClientRect();
  if(rect.top<window.innerHeight-10){el.classList.add('is-visible')}
  else{el.classList.add('reveal-on-scroll');revealObserver.observe(el)}
 });
}

eyebrow">${a.heroTag}</span><h1>${a.heroTitle}</h1><p>${a.heroText}</p><div class="actions"><a class="btn" href="#approach">${a.discover} →</a><a class="btn outline" href="#contact">${a.diagnosis}</a></div></div><div class="hero-image" role="img" aria-label="Espace de travail contemporain"><div class="image-note">${a.heroNote}</div></div></div>${section(a.beyond,a.beyondText,tiles(a.three))}${section(a.why,a.whyText,tiles(a.whyItems),'alt')}${section(a.expertise,a.expertiseText,servicesCards())}${section(a.method,a.methodText,steps(),'alt')}${section(a.demo,a.demoText,`<div id="demo">${demo()}</div>`)}${cta()}`}
function pageHead(title,subtitle){return `<div class="page-head"><div class="wrap"><span class="eyebrow">ONEBYONE CX / PORTUGUESE MARKET QUALITY DESK · FRANCE–SPAIN LIAISON</span><h1>${title}</h1><p>${subtitle}</p></div></div>`}function approach(){let a=t();return `${pageHead(a.approachTitle,a.approachText)}${section('', '',`<div class="feature"><div><p class="eyebrow">ONEBYONE CX / PHILOSOPHIE</p><p class="quote">“${a.approachQuote}”</p><p>${a.approachMore}</p></div><div class="photo" role="img" aria-label="Bureau de collaboration"></div></div>`)}${section(a.method,a.methodText,steps(),'alt')}${section(a.beyond,a.beyondText,`<div class="grid four">${a.pillars.map((x,i)=>`<div class="tile"><span class="number">0${i+1}</span><h3>${x}</h3></div>`).join('')}</div>`,'alt')}${cta()}`}
function services(){let a=t();return `${pageHead(a.servicesTitle,a.servicesText)}<section class="section"><div class="wrap"><div class="services-detail">${a.services.map((x,i)=>`<article><span class="eyebrow">SERVICE 0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p><a href="#contact" class="btn outline">${a.diagnosis} →</a></article>`).join('')}</div></div></section>${section(a.deliverables,'',tiles(a.deliverableItems.map(x=>[x,''])),'alt')}${section(a.audienceTitle,a.audienceText,tiles(a.audiences),'alt')}${section(a.offersTitle,a.offerNote,tiles(a.offers))}${cta()}`}
function method(){let a=t();return `${pageHead(a.methodsTitle,a.methodsText)}${section(a.method,a.methodText,steps())}${section(a.beyond,a.beyondText,`<p class="notice">${a.methodDisclaimer}</p>`,'alt')}${cta()}`}
function examples(){let a=t();return `${pageHead(a.examplesTitle,a.examplesText)}${section(a.demo,a.demoText,`<div id="demo">${demo()}</div>`)}${cta()}`}
function audience(){let a=t();return `${pageHead(a.audienceTitle,a.audienceText)}${section(a.expertise,a.expertiseText,tiles(a.audiences))}${cta()}`}
function about(){let a=t();return `${pageHead(a.aboutTitle,a.aboutText)}${section('', '',`<div class="feature"><div><p class="quote">“${a.aboutQuote}”</p><p>${a.approachMore}</p></div><div class="founder">${a.founder}</div></div>`)}${cta()}`}
function contact(){let a=t();return `${pageHead(a.contactTitle,a.contactText)}<section class="section"><div class="wrap"><div class="form" id="contactForm">${a.fields.map((x,i)=>`<label class="field ${i===8?'full':''}">${x}${i===5?`<select name="field${i}">${a.services.map(y=>`<option>${y[0]}</option>`).join('')}</select>`:i===8?`<textarea name="field${i}" required></textarea>`:`<input name="field${i}" ${i===2?'type="email"':''} ${[0,1,2].includes(i)?'required':''}>`}</label>`).join('')}<label class="field full" style="font-weight:400"><span><input type="checkbox" id="consent" style="width:auto" required> ${a.consent}</span></label><div class="field full"><button class="btn" type="button" id="sendForm">${a.send} →</button><p class="small">${a.contactNotice}</p><div class="result" id="contactResult" aria-live="polite"></div></div></div></div></section>${section(a.diagTitle,a.diagText,`<div class="diagnostic"><div class="form"><label class="field">${a.contentType}<select id="diagType"><option>Email</option><option>Website</option><option>Publicité / Publicidade</option><option>Newsletter</option></select></label><label class="field">${a.sourceLang}<select><option>Français</option><option>English</option><option>Español</option></select></label><label class="field full">${a.audienceLabel}<input placeholder="B2B / B2C — Portugal"></label><label class="field full">${a.sample}<textarea id="diagSample" placeholder="${esc(a.cases[0][1])}"></textarea></label></div><button class="btn" id="runDiagnostic">${a.runDemo} →</button><div class="result" id="diagResult"><strong>${a.diagResult}</strong><p>${a.diagResultText}</p></div></div>`,'alt')}`}
function render(){let a=t();document.documentElement.lang=language==='fr'?'fr':language==='pt'?'pt-PT':'es-ES';document.title='OneByOne CX — Cultural Communication & Business Liaison';document.getElementById('language').innerHTML=['fr','pt','es'].map(l=>`<button type="button" class="lang-option ${language===l?'selected':''}" data-lang="${l}" aria-pressed="${language===l}">${l.toUpperCase()}</button>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{language=b.dataset.lang;localStorage.setItem('onebyone-language',language);render()});document.getElementById('nav').innerHTML=[0,1,2,4,7].map(i=>`<a href="#${routes[i]}" data-nav="${routes[i]}" class="${i===7?'nav-contact':''}">${a.nav[i]}${i===7?' →':''}</a>`).join('');let page=location.hash.slice(1)||'home';if(!routes.includes(page))page='home';let pages={home,approach,services,method,examples,audience,about,contact};document.getElementById('app').innerHTML=`<div class="page active">${pages[page]()}</div>`;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===page));document.getElementById('nav').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');document.getElementById('footTag').textContent=a.footerTag;document.getElementById('footExplore').textContent=a.footerExplore;document.getElementById('footLinks').innerHTML=[1,2,6,7].map(i=>`<a href="#${routes[i]}">${a.nav[i]}</a>`).join('');document.getElementById('footContact').textContent=a.footerContact;document.getElementById('footCta').textContent=a.footerCta;document.getElementById('footLegal').textContent=a.footerLegal;document.getElementById('footBottom').textContent=a.footerBottom;document.getElementById('year').textContent=new Date().getFullYear();document.querySelectorAll('[data-case]').forEach(x=>x.onclick=()=>{caseIndex=+x.dataset.case;document.getElementById('demo').innerHTML=demo();document.querySelectorAll('[data-case]').forEach(y=>y.onclick=()=>{caseIndex=+y.dataset.case;document.getElementById('demo').innerHTML=demo();bindDemo()})});bindDemo();if(page==='contact'){document.getElementById('runDiagnostic').onclick=()=>document.getElementById('diagResult').classList.add('show');document.getElementById('sendForm').onclick=submitContact}window.scrollTo(0,0);initScrollReveal()}function bindDemo(){document.querySelectorAll('[data-case]').forEach(x=>x.onclick=()=>{caseIndex=+x.dataset.case;document.getElementById('demo').innerHTML=demo();bindDemo()})}function submitContact(){let a=t(),inputs=[...document.querySelectorAll('#contactForm [name]')],invalid=inputs.find(x=>!x.checkValidity());if(invalid){invalid.reportValidity();return}if(!document.getElementById('consent').checked){document.getElementById('consent').focus();return}let summary=inputs.map((x,i)=>`${a.fields[i]}: ${x.value}`).join('\n');let result=document.getElementById('contactResult');result.classList.add('show');result.innerHTML=`<strong>${a.mailMissing}</strong><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:.78rem">${esc(summary)}</pre><button type="button" class="btn outline" id="copySummary">${a.copy}</button>`;document.getElementById('copySummary').onclick=async()=>{try{await navigator.clipboard.writeText(summary);document.getElementById('copySummary').textContent=a.copied}catch(e){}}}document.getElementById('menu').onclick=()=>{let n=document.getElementById('nav');n.classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',n.classList.contains('open'))};window.addEventListener('hashchange',render);render();
</script></body></html>
